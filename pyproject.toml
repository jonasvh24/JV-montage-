[project]
name = "nullmontage"
version = "0.1.0"
description = "Beat-synced Soviet-montage photo video builder"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "librosa>=0.10",
    "soundfile>=0.12",
    "numpy>=1.26",
    "pillow>=10.0",
    "imageio-ffmpeg>=0.5",
    "pydantic>=2.7",
    "anthropic>=0.40",
    "pillow-heif>=1.8.0",
]

[project.scripts]
nullmontage = "nullmontage.server:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nullmontage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
